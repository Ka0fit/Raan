<style>
:root{--bg:#F6F7F5;--card:#fff;--soft:#F1EFEA;--line:#E4E2DC;--line2:#CFCCC4;--text:#222;--mut:#77756f;
--pri:#D85A30;--dark:#4A1B0C;--pri-soft:#FAECE7;--deep:#712B13;--light:#F0997B;
--green:#0F6E56;--green-soft:#E1F5EE;--red:#A32D2D;--red-soft:#FCEBEB;--purple:#534AB7;--purple-soft:#EEEDFE;--blue:#185FA5}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Sarabun",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-size:16px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.page{display:none;max-width:600px;margin:0 auto}
.page.on{display:block}
.wrap{padding:0 16px}
/* หัวสีเข้ม */
.band{background:var(--card);color:var(--text);border-bottom:1px solid var(--line);padding:16px 16px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.band.hh{padding-bottom:16px}
.band small{display:block;font-size:13px;color:var(--mut)}
.band h1{font-size:21px;font-weight:600}
.av{width:42px;height:42px;border-radius:50%;background:var(--deep);border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--pri-soft);overflow:hidden;cursor:pointer;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.sydot{width:9px;height:9px;border-radius:50%;background:#B4B2A9;flex-shrink:0;margin-left:-2px}.sydot.ok{background:#1D9E75}.sydot.sync,.sydot.load{background:#EF9F27}.sydot.offline,.sydot.pause{background:#B4B2A9}.sydot.err{background:#E24B4A}
.userbtn{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:26px;padding:3px 14px 3px 3px;cursor:pointer;flex-shrink:0;max-width:50%}
.userbtn span{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{margin:14px 16px 14px;background:var(--card);border-radius:20px;padding:16px;border:1px solid var(--line);position:relative}
.hero small{font-size:13px;color:var(--mut)}
.hero .n{font-size:30px;font-weight:700;margin:2px 0 12px}
.hero .n span{font-size:14px;font-weight:400;color:var(--mut);margin-left:6px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:12px}
.stat div{text-align:center;font-size:12px;color:var(--mut);cursor:pointer}
.stat b{display:block;font-size:16px;color:var(--text)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.duo .bx{cursor:pointer;min-width:0}
.duo .bx small{display:block;font-size:12px;color:var(--mut)}
.duo .bx b{font-size:21px;font-weight:700}
.duo .bx.r{text-align:right;border-left:1px solid var(--line);padding-left:10px}
.duo .bx.r b{color:var(--pri)}
/* การ์ด */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{font-size:16px;font-weight:600;margin-bottom:8px}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px;cursor:pointer;color:var(--text)}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.b{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.r{color:var(--red);border-color:#F09595}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:10px}
.btn.sel{background:var(--pri-soft);color:var(--pri);border-color:var(--pri)}
.wide{width:100%;padding:14px;font-size:18px;font-weight:600;border-radius:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.f{flex:1}
.hrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px;cursor:pointer;min-width:0}
.tile b{display:block;font-size:17px;font-weight:600;margin-bottom:6px;overflow-wrap:anywhere}
.tile.ed{border-style:dashed;border-color:var(--pri)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips span{background:var(--soft);border-radius:6px;padding:2px 7px;font-size:13px;color:var(--mut)}
.choice{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px;margin-bottom:12px;cursor:pointer}
.choice .ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.choice b{display:block;font-size:19px;font-weight:600}
.choice small{font-size:14px;color:var(--mut)}
.debtc.g2{background:radial-gradient(circle at 96% 120%,rgba(255,170,170,.35) 0 56px,transparent 57px),radial-gradient(circle at 75% -40%,rgba(255,255,255,.12) 0 64px,transparent 65px),linear-gradient(120deg,#8E1B1F 0%,#B91C1C 50%,#E0484B 100%);border:none;color:#fff;box-shadow:0 8px 20px -8px rgba(185,28,28,.6);overflow:hidden}
.debtc.g2 .ic{background:rgba(255,255,255,.18);color:#fff;width:44px;height:44px}
.debtc.g2 b{color:#fff;font-size:18px}.debtc.g2 small{color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.debtc.g2 .amt{color:#fff}.debtc.g2 .amt strong{font-size:26px}
.debtc{display:flex;align-items:center;gap:12px;background:#FCEBEB;border:1.5px solid #E24B4A;border-radius:16px;padding:14px;margin-bottom:12px;cursor:pointer}
.debtc .ic{width:46px;height:46px;border-radius:50%;background:#E24B4A;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.debtc .ic svg{width:24px;height:24px}
.debtc b{display:block;font-size:17px;color:#791F1F}.debtc small{display:block;font-size:14px;color:#A32D2D;line-height:1.5}
.debtc .amt{text-align:right;flex-shrink:0;color:#A32D2D}.debtc .amt strong{display:block;font-size:26px;line-height:1.1}.debtc .amt em{font-style:normal;font-size:13px}
.bkw{display:flex;align-items:center;gap:10px;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D;border-radius:14px;padding:12px;margin-bottom:12px}
.bkw b{display:block;font-size:15px}.bkw small{font-size:13px}.bkw .btn{flex-shrink:0}
.mtile{position:relative}.mtile.out{opacity:.45}.mtile .outb{position:absolute;top:6px;left:6px;background:var(--red);color:#fff;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px}
.tag.out{background:var(--red);color:#fff}
.dbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.secH{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;margin:4px 0 10px}
.plusb{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--card);font-size:18px;line-height:1;color:var(--mut);cursor:pointer}
.sep{border-top:1px solid var(--line);margin:16px 0 12px}
.secT{font-size:15px;font-weight:600;margin:4px 0 10px}
input,select{border:1px solid var(--line2);border-radius:12px;padding:11px 12px;font-size:16px;width:100%;background:var(--card);color:var(--text)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri)}
label{font-size:13px;color:var(--mut);display:block;margin:14px 0 6px}
.chk{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--text)}
.seg{display:grid;gap:5px;background:var(--soft);padding:4px;border-radius:14px}
.seg button{border:0;background:none;border-radius:10px;padding:10px 4px;font-size:15px;color:var(--text);cursor:pointer}
.seg button small{display:block;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--pri);color:#fff}
.seg button.on small{color:var(--pri-soft)}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:5px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:12px}
.tabs button{border:0;background:none;border-radius:10px;padding:10px 4px;font-size:15px;cursor:pointer;color:var(--text)}
.tabs button.on{background:var(--pri-soft);color:var(--deep);font-weight:600}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.list .it:last-child{border-bottom:0}
.sum{display:flex;justify-content:space-between;padding:4px 0}
.sum.t{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.plus{color:var(--green)}.minus{color:var(--red)}
.mut{color:var(--mut);font-size:14px}
.note{color:var(--pri);font-size:14px}
.pend{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);cursor:pointer}
.pend .l{min-width:0}
.pend .l b{font-size:16px;font-weight:600}
.pend .l small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pend .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.pend .r .act{display:flex;gap:6px}
.tag{display:inline-block;background:var(--purple-soft);color:var(--purple);border-radius:8px;font-size:12px;padding:1px 7px;margin-left:4px;vertical-align:2px}
/* สรุป */
.bigc{background:var(--green-soft);border-radius:18px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.bigc.neg{background:var(--red-soft)}
.bigc small{display:block;font-size:13px;color:var(--mut)}
.bigc b{font-size:30px;font-weight:700;color:var(--green)}
.bigc.neg b{color:var(--red)}
.bigc em{font-style:normal;font-size:13px;color:var(--mut);margin-left:8px}
.smc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer}
.smc small{display:block;font-size:12px;color:var(--mut)}
.smc b{font-size:20px;font-weight:700}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:8px;font-size:15px;color:var(--mut);cursor:pointer}
.lrow b{color:var(--text);font-weight:600;text-align:right}
.lrow.warn{background:var(--red-soft);border-color:#F09595}
.lrow.warn b{color:var(--red)}
.lrow.ok b{color:var(--green)}
.lrow .arr{color:var(--mut);margin-left:4px}
.mnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mnav b{font-size:18px}
.mnav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:var(--card);font-size:16px;color:var(--text)}
/* ปฏิทิน */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{height:46px;border-radius:12px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.cal .h{height:auto;font-size:12px;color:var(--mut);padding-bottom:4px;cursor:default}
.cal .e{cursor:default}
.cal .o{background:var(--pri-soft);color:var(--deep);font-weight:600}
.cal .td{background:var(--pri);color:#fff;font-weight:700}
.dots{display:flex;gap:3px;margin-top:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.dp{background:#7F77DD}.db{background:#1D9E75}.dw{background:#fff}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:12px}
.lg span{display:flex;align-items:center;gap:5px}
.lg .sw{width:12px;height:12px;border-radius:4px;background:var(--pri-soft)}
.preC{display:flex;align-items:center;gap:12px;cursor:pointer}
.preC .ic{width:46px;height:46px;border-radius:14px;background:var(--purple-soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.preC b{display:block;font-size:16px;font-weight:600}
.preC small{font-size:13px;color:var(--mut)}
.badge{background:var(--purple);color:#fff;border-radius:10px;font-size:12px;padding:1px 8px;margin-left:4px;vertical-align:2px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:30}
.overlay.on{display:flex}
.box{background:var(--card);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.box h2{font-size:21px;font-weight:600;margin-bottom:4px}
.total{font-size:26px;font-weight:700;text-align:center;margin:12px 0;color:var(--pri)}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.amt{font-size:24px;font-weight:700;color:var(--pri)}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--card);font-size:20px;color:var(--text)}
.qty b{min-width:22px;text-align:center;font-size:18px}
.citem{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.citem .top{display:flex;justify-content:space-between;gap:8px}
.citem .name{font-size:18px;font-weight:600}
.citem .opt{color:var(--mut);margin:2px 0 6px;font-size:14px}
.citem .bot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.citem .price{font-size:20px;font-weight:700;color:var(--pri)}
.carttotal{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0}
.carttotal b{font-size:28px;color:var(--pri)}
.qrimg{display:block;width:100%;max-width:280px;margin:0 auto;border-radius:14px;border:1px solid var(--line)}
.upl{border:1.5px dashed var(--line2);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;cursor:pointer}
.upl .sq{width:58px;height:58px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;overflow:hidden}
.upl .sq.round{border-radius:50%}
.upl .sq img{width:100%;height:100%;object-fit:cover}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatches button{width:44px;height:44px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line2);cursor:pointer}
.swatches button.on{box-shadow:0 0 0 3px var(--text)}
/* แถบล่าง */
.floatb{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:1px solid var(--line2);background:var(--card);font-size:24px;z-index:10}
#calcBtn{right:16px;display:none}
body.onshop #calcBtn{display:block}
body.onpre #cartBtn{right:16px}
#cartBtn{right:82px;display:none}
body.ordering #cartBtn{display:block}
#cartBadge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--red);color:#fff;font-size:13px;font-weight:700;line-height:22px;text-align:center}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{padding:16px 0;font-size:22px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
.keys .op{background:var(--soft)}
.keys .eq{background:var(--pri);color:#fff;grid-column:span 2}
.disp{font-size:30px;text-align:right;padding:12px;background:var(--soft);border-radius:12px;margin-bottom:10px;word-break:break-all;min-height:62px}
.disp small{display:block;font-size:15px;color:var(--mut)}

.demo{background:var(--pri-soft);color:var(--deep);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.urow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.urow:last-child{border-bottom:0}
.urow .av{width:44px;height:44px;background:var(--soft);color:var(--mut);border:0}
.pill{background:var(--green-soft);color:var(--green);border-radius:10px;font-size:13px;padding:3px 10px}
textarea{border:1px solid var(--line2);border-radius:12px;padding:10px;font-size:13px;width:100%;min-height:110px;font-family:monospace;background:var(--card);color:var(--text)}
#toast{position:fixed;left:50%;bottom:150px;max-width:86vw;text-align:center;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:15px;z-index:90;display:none}
.due{background:var(--deep);color:#fff;border-radius:20px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;cursor:pointer}
.due.today{background:radial-gradient(circle at 92% 115%,rgba(255,214,120,.45) 0 60px,transparent 61px),radial-gradient(circle at 70% -30%,rgba(255,255,255,.12) 0 70px,transparent 71px),linear-gradient(120deg,#9A3412 0%,#C2410C 45%,#EA8A1F 100%);position:relative;overflow:hidden;box-shadow:0 8px 20px -8px rgba(194,65,12,.6)}
.due.today::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);animation:shine 3.5s ease-in-out 1s infinite}
@keyframes shine{0%{left:-80px}45%,100%{left:110%}}
.due.today small .bell{display:inline-block;transform-origin:50% 0;animation:ring 2.5s ease-in-out infinite}
@keyframes ring{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(16deg)}80%{transform:rotate(-14deg)}85%{transform:rotate(10deg)}90%{transform:rotate(-6deg)}}
.due .spd{position:absolute;right:20px;top:50%;width:22px;margin-top:-4px;pointer-events:none}
.due .spd i{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.75);margin:6px 0;animation:spd .9s linear infinite}
.due .spd i:nth-child(2){width:70%;margin-left:30%;animation-delay:.3s}.due .spd i:nth-child(3){width:50%;animation-delay:.6s}
@keyframes spd{0%{transform:translateX(-6px);opacity:0}30%{opacity:1}100%{transform:translateX(14px);opacity:0}}
.due .scoot.go{animation:none}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.due .scoot{width:90px;height:auto;flex-shrink:0;margin:-6px 32px -8px 0;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2));pointer-events:none;position:relative;z-index:1}
.due.today>div:first-child{flex:1}.due.today small{margin-bottom:6px}.due.today b{font-size:24px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due.today .s{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
@keyframes scootIn{0%{transform:translateX(40px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.due small{display:block;font-size:13px;color:var(--pri-soft);margin-bottom:10px;opacity:.9}
.due b{display:block;font-size:17px;font-weight:600}
.due .s{font-size:13px;color:var(--pri-soft);opacity:.9}
.due .cnt{text-align:center;flex-shrink:0}
.due .cnt em{font-style:normal;font-size:12px;display:block;color:var(--pri-soft)}
.due .cnt strong{font-size:46px;font-weight:700;line-height:1}
.pend.today{border:2px solid #E24B4A}
.tag.red{background:var(--red-soft);color:var(--red)}
.stp{display:inline-block;border-radius:10px;font-size:14px;padding:6px 10px;white-space:nowrap;background:#FAEEDA;color:#854F0B;cursor:pointer;font-weight:600}
.stp.ok{background:var(--green-soft);color:var(--green)}
.wheel{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;height:150px;background:var(--soft);border-radius:14px;overflow:hidden}
.wheel::before{content:"";position:absolute;left:12px;right:12px;top:50px;height:50px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.wheel>b{position:relative;font-size:26px;color:var(--pri)}
.wcol{position:relative;height:150px;width:76px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wcol::-webkit-scrollbar{display:none}
.wcol div{height:50px;line-height:50px;text-align:center;font-size:24px;color:var(--mut);scroll-snap-align:center;cursor:pointer}
.wcol div.on{color:var(--pri);font-size:30px;font-weight:700}
.wcol .sp{scroll-snap-align:none}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:10px}
.qrt{border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center;cursor:pointer}
.qrt img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.qrt b{display:block;margin-top:6px;font-size:14px}
.qrchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.split>.side{display:none}
@media (min-width:700px){
 .page{max-width:1100px}
 .wrap{padding:0 24px}
 .band{padding-left:24px;padding-right:24px}
 .hero{margin-left:24px;margin-right:24px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
 .overlay{align-items:center}
 .box{max-width:560px;border-radius:22px;max-height:88vh;padding-bottom:18px}

}
@media (min-width:900px) and (min-height:600px) and (orientation:landscape){
 .split{display:flex;gap:16px;align-items:flex-start}
 .split>.main{flex:1.6;min-width:0}
 .split>.side{display:block;flex:1;min-width:300px;max-width:420px;position:sticky;top:12px;max-height:calc(100vh - 140px - env(safe-area-inset-bottom,0px));max-height:calc(100dvh - 140px - env(safe-area-inset-bottom,0px));overflow:auto;padding-bottom:30px!important;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
 body.ordering #cartBtn{display:none}
}
/* แถบล่างแบบลอย */
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(70px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,1fr);align-items:stretch;z-index:10;filter:drop-shadow(0 -2px 10px rgba(0,0,0,.08))}
#nav::before{content:"";position:absolute;inset:0;background:var(--card);border-radius:20px 20px 0 0;-webkit-mask:linear-gradient(#000,#000) left top/calc(50% - 60px) 100% no-repeat,url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27120%27%20height%3D%2760%27%20viewBox%3D%270%200%20120%2060%27%3E%3Cpath%20d%3D%27M0%200H16C24%200%2027%203%2029.2%208A30.8%2030.8%200%200%200%2090.8%208C93%203%2096%200%20104%200H120V60H0Z%27%20fill%3D%27black%27/%3E%3C/svg%3E") center top/120px 60px no-repeat,linear-gradient(#000,#000) right top/calc(50% - 60px) 100% no-repeat,linear-gradient(#000,#000) left 60px/100% calc(100% - 60px) no-repeat;mask:linear-gradient(#000,#000) left top/calc(50% - 60px) 100% no-repeat,url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27120%27%20height%3D%2760%27%20viewBox%3D%270%200%20120%2060%27%3E%3Cpath%20d%3D%27M0%200H16C24%200%2027%203%2029.2%208A30.8%2030.8%200%200%200%2090.8%208C93%203%2096%200%20104%200H120V60H0Z%27%20fill%3D%27black%27/%3E%3C/svg%3E") center top/120px 60px no-repeat,linear-gradient(#000,#000) right top/calc(50% - 60px) 100% no-repeat,linear-gradient(#000,#000) left 60px/100% calc(100% - 60px) no-repeat}
#nav button{position:relative;border:0;background:none;padding:0 0 7px;font-size:11px;color:#9a9a96;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}
#nav button span{display:flex;align-items:center;justify-content:center}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--pri);font-weight:600}
#nav button.on:not(.mid)::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--pri);margin-top:1px}
#nav button:not(.on):not(.mid)::after{content:"";width:5px;height:5px;margin-top:1px}
#nav button.mid{color:var(--pri);font-weight:600;padding-bottom:14px}
#nav button.mid span{position:absolute;left:50%;top:-21px;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;background:var(--card);border:2.5px solid var(--pri);box-sizing:border-box}
#nav button.mid.on span{background:var(--pri);color:#fff}
#nav button.mid svg{width:28px;height:28px;stroke-width:2}
/* หน้าแรกแดชบอร์ด */
.ptabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 12px}
.ptabs button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 0;font-size:14px;color:var(--text);cursor:pointer}

.stylepick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

.up{color:var(--green)}.dn{color:var(--red)}

<script>
if(window.__RUN_STORED)throw 'running updated version';
const $=s=>document.querySelector(s);
const KEY='shopapp_v1';
const BLANK=()=>({goal:0,fixed:[],lastBackup:'',menus:[],items:[],orders:{},buys:{},cash:{},boxFee:5,pending:[],profile:{shop:'',owner:''},qr:'',qrs:[],avatar:'',theme:'forest',pin:'',close:{},reopen:{},waste:{},debts:[],addons:[{id:'a1',name:'ไข่ดาว',price:10},{id:'a2',name:'ไข่เจียว',price:15},{id:'a3',name:'ข้าวเพิ่ม',price:10}],cats:['อาหารจานเดียว','ก๋วยเตี๋ยว','กับข้าว','ของทานเล่น','เครื่องดื่ม']});

try{const m=JSON.parse(localStorage.getItem(META_K));if(m&&m.users&&m.users.length)META=Object.assign(META,m)}catch(e){}

function fix(){if((S.uiv||0)<3){S.theme='forest';S.uiv=3}if(!S.cats||!S.cats.length)S.cats=['อาหารจานเดียว','ก๋วยเตี๋ยว','กับข้าว','ของทานเล่น','เครื่องดื่ม'];S.menus.forEach(m=>{if(!m.cat||!S.cats.includes(m.cat))m.cat=S.cats[0]});S.items.forEach(x=>{if(x.type=='ing'&&!x.cat)x.cat='meat'});S.pending.forEach(p=>{if(!p.created)p.created=p.date});if(!S.fixed)S.fixed=[];if(!S.close)S.close={};if(!S.waste)S.waste={};if(!S.debts)S.debts=[];if(!S.ingCats||!S.ingCats.length)S.ingCats=DEFCATS.map(c=>({...c}));if(!S.addons)S.addons=BLANK().addons;if(!S.qrs)S.qrs=[];if(S.qr){S.qrs.unshift({id:'q'+Date.now().toString(36),amount:0,img:S.qr});S.qr=''}}
function loadUser(id){META.cur=id;S=readData(id);AV=readAv(id);
 if(S.avatar){AV=S.avatar;try{localStorage.setItem(avKey(id),AV)}catch(e){}delete S.avatar;save()}
 fix();cart=[];cartNote='';saveMeta();if(typeof syncKick=='function')setTimeout(syncKick,50)}
function save(){if(DEMO)return;try{localStorage.setItem(dataKey(META.cur),JSON.stringify(S))}catch(e){toast('บันทึกไม่สำเร็จ พื้นที่เต็ม ลองลดขนาดรูป')}if(typeof syncDirty=='function')syncDirty()
 const u=META.users.find(x=>x.id==META.cur);if(u&&u.name!=S.profile.owner){u.name=S.profile.owner;saveMeta()}}
let askFn=null,askNoFn=null;function ask(m,fn,html,o){o=o||{};askFn=fn;askNoFn=o.no||null;$('#askMsg')[html?'innerHTML':'textContent']=m;$('#askYes').textContent=o.yes||'ยืนยัน';$('#askNo').textContent=o.noTxt||'ยกเลิก';$('#ask').classList.add('on')}
function askClose(){askFn=null;askNoFn=null;$('#ask').classList.remove('on')}
function askNo(){const f=askNoFn;askClose();if(f)f()}
function askOk(){const f=askFn;askClose();if(f)f()}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1600)}
function applyFont(){document.body.style.zoom=[1,1.15,1.3][META.font||0]}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const fm=n=>(Math.round(n*100)/100).toLocaleString('th-TH');
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=key(new Date());
const TOMORROW=key(new Date(Date.now()+864e5));
const MTH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const MTHF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const DAYS=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const SIZES=['ธรรมดา','พิเศษ','อื่นๆ'];
const CATS={meat:{name:'เนื้อ',icon:'🥩',units:['กิโล','ถุง','เข่ง','แพ็ค','ตัว','ชิ้น']},veg:{name:'ผัก',icon:'🥬',units:['กิโล','มัด','กำ','หัว','ลูก','ถุง','แพ็ค','เข่ง','แผง']},eq:{name:'อุปกรณ์',icon:'🥄',units:['ชิ้น','แพ็ค','ถุง','ลัง','อัน','โหล']}};
const THEMES={
 forest:{n:'เขียวป่า',pri:'#0F5132',dark:'#0B3D26',soft:'#E1F5EE',deep:'#085041',light:'#9FE1CB'},
 orange:{n:'ส้มอิฐ',pri:'#D85A30',dark:'#4A1B0C',soft:'#FAECE7',deep:'#712B13',light:'#F0997B'},
 green:{n:'เขียว',pri:'#1D9E75',dark:'#04342C',soft:'#E1F5EE',deep:'#085041',light:'#5DCAA5'},
 blue:{n:'น้ำเงิน',pri:'#378ADD',dark:'#042C53',soft:'#E6F1FB',deep:'#0C447C',light:'#85B7EB'},
 purple:{n:'ม่วง',pri:'#7F77DD',dark:'#26215C',soft:'#EEEDFE',deep:'#3C3489',light:'#AFA9EC'},
 pink:{n:'ชมพู',pri:'#D4537E',dark:'#4B1528',soft:'#FBEAF0',deep:'#72243E',light:'#ED93B1'},
 gray:{n:'เทาเข้ม',pri:'#5F5E5A',dark:'#2C2C2A',soft:'#F1EFE8',deep:'#444441',light:'#B4B2A9'}};
function setHomeName(){const n=(S.profile&&S.profile.shop)||'ร้านของฉัน';document.title=n;document.querySelectorAll('meta[name=apple-mobile-web-app-title],meta[name=application-name]').forEach(m=>m.content=n)}
function applyTheme(){setHomeName();const t=THEMES[S.theme]||THEMES.forest,r=document.documentElement.style;
 document.body.classList.toggle('plain',S.look=='plain');r.setProperty('--pri',t.pri);r.setProperty('--dark',t.dark);r.setProperty('--pri-soft',t.soft);r.setProperty('--deep',t.deep);r.setProperty('--light',t.light)}
CATS.sauce={name:'เครื่องปรุง',icon:'🧂',units:['ขวด','ถุง','กิโล','แพ็ค','กระปุก','ลิตร','แกลลอน','ลัง']};CATS.other={name:'อื่นๆ',icon:'📦',units:['ชิ้น','ถุง','กิโล','แพ็ค','ลัง','ขวด','อัน','กระสอบ','ถัง','แผง']};
let ING=['meat','veg','sauce','other'];
const DEFCATS=ING.map(k=>({k,name:CATS[k].name,icon:CATS[k].icon})),BASEU={};ING.forEach(k=>BASEU[k]=CATS[k].units);
const ALLU=['กิโล','ถุง','แพ็ค','ขวด','ชิ้น','กำ','มัด','ลัง','เข่ง','กล่อง','กระปุก','แผง'];
function syncCats(){const L=(S.ingCats&&S.ingCats.length)?S.ingCats:DEFCATS;ING=L.map(c=>c.k);L.forEach(c=>{CATS[c.k]={name:c.name,icon:c.icon||'🏷️',units:BASEU[c.k]||ALLU}})}
const icOk=c=>c&&c!='eq'&&ING.includes(c);
const catOf=x=>x.type=='eq'?'eq':(icOk(x.cat||'meat')?(x.cat||'meat'):(ING.includes('other')?'other':ING[ING.length-1]));
function thDate(k){const[y,m,d]=k.split('-').map(Number);return d+' '+MTHF[m-1]+' '+(y+543)+(k==TODAY?' (วันนี้)':'')}
function thShort(k){const[y,m,d]=k.split('-').map(Number);return DAYS[new Date(y,m-1,d).getDay()]+' '+d+' '+MTH[m-1]}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

let D={buy:TODAY,sum:TODAY};
let cart=[],cartNote='',cartDue=TOMORROW,orderMode='shop',itemTab='ing',sumMode='month',sumY=new Date().getFullYear(),sumM=new Date().getMonth(),calY=sumY,calM=sumM,cur=null,page='sell';

function openM(h){$('#mbox').innerHTML=h;$('#modal').classList.add('on')}
let _mcT=0,_lc=[0,0],_mcXY=null;function closeM(){$('#modal').classList.remove('on');_mcT=Date.now();_mcXY=_lc}
function justClosed(){return Date.now()-_mcT<350}
document.addEventListener('click',e=>{const near=_mcXY&&Math.abs(e.clientX-_mcXY[0])<45&&Math.abs(e.clientY-_mcXY[1])<45;_lc=[e.clientX,e.clientY];if(justClosed()&&near&&!$('#modal').classList.contains('on')&&!$('#ask').classList.contains('on')&&e.target.closest('button,.pend,.mtile,.floatb,a,[onclick]')){e.stopPropagation();e.preventDefault()}},true);

const NAVOF={sell:'sell',shop:'sell',pre:'sell',menu:'menu',cal:'cal',stock:'stock',sum:'sum',user:''};
function go(p){page=p;if(p=='shop')orderMode='shop';if(p=='pre')orderMode='pre';
 document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',e.id==p));
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p==NAVOF[p]));
 document.body.classList.toggle('ordering',p=='shop'||p=='pre');document.body.classList.toggle('onshop',p=='shop');document.body.classList.toggle('onpre',p=='pre');syncCats();R[p]();updateBar();renderSide();scrollTo(0,0);
 if(p=='shop'&&S.close[TODAY])ask(`วันนี้ปิดยอดไปแล้วตอน ${S.close[TODAY].time} ต้องการเปิดร้านใหม่ไหม?`,reopenShop,0,{yes:'เปิดร้านใหม่',noTxt:'ไม่ กลับหน้าแรก',no:()=>go('sell')});
 else if(p=='shop'&&S.cash[TODAY]===undefined)askCash()}
const MQ=matchMedia('(min-width:900px) and (min-height:600px) and (orientation:landscape)');
function isWide(){return MQ.matches}
function onWide(){document.body.classList.toggle('ipadw',isWide());if(isWide()&&(page=='shop'||page=='pre')&&$('#modal').classList.contains('on')&&$('#mbox .cartmark'))closeM();rr()}
document.body.classList.toggle('ipadw',isWide());if(MQ.addEventListener)MQ.addEventListener('change',onWide);else if(MQ.addListener)MQ.addListener(onWide);
function rr(){syncCats();R[page]();updateBar();renderSide();fitSide()}
function fitSide(){const n=$('#nav'),nt=n?n.getBoundingClientRect().top:innerHeight;document.querySelectorAll('.split>.side').forEach(sd=>{if(!sd.offsetParent)return;const t=Math.max(12,sd.getBoundingClientRect().top);sd.style.maxHeight=Math.max(200,nt-t-12)+'px'})}
addEventListener('scroll',fitSide,{passive:true});addEventListener('resize',fitSide);setInterval(fitSide,1000);

function userBtn(){const nm=S.profile.owner||'ผู้ใช้';return `<div class="userbtn" onclick="go('user')"><div class="av" style="width:36px;height:36px">${AV?`<img src="${AV}" alt="">`:'👤'}</div><span>${esc(nm)}</span>${META.sync&&META.sync.on?`<i class="sydot ${SY.st}"></i>`:''}</div>`}
function band(title,hero,back){return (DEMO?`<div class="demo"><span>กำลังดู<b>ข้อมูลตัวอย่าง</b> · ข้อมูลจริงเก็บแยกไว้ ไม่หาย</span><button class="btn sm" onclick="exitDemo()">ล้างตัวอย่าง</button></div>`:'')+`<div class="band${hero?' hh':''}"><div style="min-width:0">${back?`<small onclick="go('${back}')" style="cursor:pointer">‹ กลับ</small>`:`<small>${esc(S.profile.shop||'ร้านของฉัน')}</small>`}<h1>${title}</h1></div>${userBtn()}</div>`}
function dateBar(w){return `<div class="mnav"><button onclick="shiftD('${w}',-1)">‹</button><span style="position:relative;flex:1;text-align:center;margin:0 6px"><b>${thDate(D[w])}</b><input type="date" value="${D[w]}" onchange="D['${w}']=this.value||TODAY;rr()" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0"></span><button onclick="shiftD('${w}',1)">›</button></div>`}
function shiftD(w,n){const[y,m,d]=D[w].split('-').map(Number);D[w]=key(new Date(y,m-1,d+n));rr()}
function segBtns(opts,curv,fn,cols){return `<div class="seg" style="grid-template-columns:repeat(${cols||opts.length},1fr)">${opts.map(o=>`<button class="${o.v===curv?'on':''}" onclick="${fn}(${JSON.stringify(o.v).replace(/"/g,'&quot;')})">${o.t}${o.s!=null?`<small>${o.s}</small>`:''}</button>`).join('')}</div>`}

/* ---------- สถิติ ---------- */
function hidOn(k){let t=0;(S.fixed||[]).forEach(f=>{if(k<f.start||(f.end&&k>=f.end))return;const[y,m]=k.split('-').map(Number);
 t+=f.period=='month'?f.amount/new Date(y,m,0).getDate():f.period=='week'?f.amount/7:f.amount});return t}
function dishes(k){const q=O=>O.reduce((a,o)=>a+(o.lines||[]).reduce((t,l)=>t+num(l.qty),0),0);return{done:q(S.orders[k]||[]),wait:q(S.pending.filter(p=>(p.date||p.created)==k))}}
function dishTxt(k){const d=dishes(k);return d.done+' จาน'+(d.wait?` <span class="mut" style="font-weight:400">(รอคิดเงินอีก ${d.wait} จาน)</span>`:'')}
function dayStats(k){const o=S.orders[k]||[],b=S.buys[k]||[];let cash=0,tr=0,ing=0,eq=0,disc=0;
 o.forEach(x=>{x.pay=='cash'?cash+=x.total:tr+=x.total;disc+=num(x.disc)});const waste=((S.waste||{})[k]||[]).reduce((a,w)=>a+num(w.amount),0);b.forEach(x=>x.type=='ing'?ing+=x.amount:eq+=x.amount);
 const hid=k<=TODAY?hidOn(k):0;
 return{cash,tr,sales:cash+tr,ing,eq,hid,cost:ing+eq+hid,profit:cash+tr-ing-eq-hid,bills:o.length,disc,waste}}
function monOf(k){const[y,m,d]=k.split('-').map(Number),w=new Date(y,m-1,d).getDay();return addD(k,-((w+6)%7))}
function daysOf(pre){let out=[];if(pre[0]=='W'){const a=pre.slice(1);for(let i=0;i<7;i++)out.push(addD(a,i))}else if(pre.length==10)out=[pre];
 else if(pre.length==7){const[y,m]=pre.split('-').map(Number),n=new Date(y,m,0).getDate();for(let d=1;d<=n;d++)out.push(pre+'-'+pad(d))}
 else for(let m=1;m<=12;m++)out=out.concat(daysOf(pre+'-'+pad(m)));
 return out.filter(k=>k<=TODAY)}
function rangeStats(pre){const t={cash:0,tr:0,sales:0,ing:0,eq:0,hid:0,cost:0,profit:0,bills:0,disc:0,waste:0};
 daysOf(pre).forEach(k=>{const s=dayStats(k);for(const i in t)t[i]+=s[i]});return t}
function menuCount(pre){const m={},ds=new Set(daysOf(pre));Object.keys(S.orders).forEach(k=>{if(!ds.has(k))return;S.orders[k].forEach(o=>o.lines.forEach(l=>{const n=l.name+' ('+SIZES[l.size]+')';m[n]=(m[n]||0)+l.qty}))});
 return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function changeGiven(k){return (S.orders[k]||[]).reduce((a,o)=>a+(o.pay=='cash'&&o.recv>o.total?o.recv-o.total:0),0)}
const RO=k=>(S.reopen||{})[k];
function cgNow(k){return changeGiven(k)-(RO(k)?RO(k).cg:0)}
function reopenShop(){const k=TODAY,c=S.close[k],n=new Date();(S.reopen=S.reopen||{})[k]={base:dayStats(k).cash,cg:changeGiven(k),time:pad(n.getHours())+':'+pad(n.getMinutes())};
 S.cash[k]=c?c.count:num(S.cash[k]);delete S.close[k];save();rr();askCash();toast('เปิดร้านใหม่แล้ว · ใส่เงินทอนที่มีตอนนี้')}
function dueNow(){return S.pending.filter(p=>p.date<=TODAY)}
function preList(){return S.pending.filter(p=>p.date>TODAY).sort((a,b)=>a.date<b.date?-1:1)}
function hasBillToday(){return (S.orders[TODAY]||[]).length>0||S.pending.some(p=>p.created==TODAY)}

const R={};

/* ---------- ล็อกรหัส ---------- */
let pinBuf='',lockTarget=null;
function needLock(){return S.pin&&S.pin.length==4&&!hasBillToday()}

function showLock(msg){const u=lockUser();$('#lock').innerHTML=`<div class="av" style="width:72px;height:72px;font-size:32px">${u.av?`<img src="${u.av}" alt="">`:'👤'}</div>

let homeP='d1';const _hp0=0,homeFrom=TODAY,homeTo=TODAY;
function addD(k,n){const[y,m,d]=k.split('-').map(Number);return key(new Date(y,m-1,d+n))}
function homeRange(){if(homeP=='d1')return[TODAY,TODAY];if(homeP=='d7')return[addD(TODAY,-6),TODAY];if(homeP=='d30')return[addD(TODAY,-29),TODAY];return[homeFrom,homeTo]}

function statsOf(days){const t={sales:0,cost:0,bills:0,profit:0};days.forEach(k=>{const s=dayStats(k);t.sales+=s.sales;t.cost+=s.cost;t.bills+=s.bills;t.profit+=s.profit});return t}

function dueCard(){const T=S.pending.filter(p=>p.pre&&p.date==TODAY).sort(byDT),F=preList().sort(byDT);
 if(T.length){const nx=T.find(p=>!p.done)||T[0],left=T.filter(p=>!p.done).length;
  return `<div class="due today" onclick="go('pre')"><div style="min-width:0"><small><span class="bell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>วันนี้ต้องส่ง ${T.length} ออเดอร์${left<T.length?' · เสร็จแล้ว '+(T.length-left):''}</small><b>${T.map(p=>(p.ptime?p.ptime+' ':'')+pendLabel(p)).join(' · ')}</b><span class="s">${left?'ยังไม่เสร็จ '+left+' ออเดอร์':'ทำเสร็จครบแล้ว รอคิดเงิน'}</span></div><img class="scoot" alt="" src="${SCOOT}"><span class="spd"><i></i><i></i><i></i></span></div>`}
 if(!F.length)return '';const p=F[0],[y,m,d]=p.date.split('-').map(Number),n=Math.round((new Date(y,m-1,d)-new Date(new Date().toDateString()))/864e5);
 return `<div class="due" onclick="go('pre')"><div style="min-width:0"><small>🔔 กำหนดการใกล้สุด</small><b>ส่งล่วงหน้า · ${pendLabel(p)}</b><span class="s">${thShort(p.date)}${p.ptime?' '+p.ptime:''} · ${fm(p.total)} บาท${F.length>1?' · อีก '+(F.length-1)+' ออเดอร์หลังจากนี้':''}</span></div><div class="cnt"><em>อีก</em><strong>${n}</strong><em>วัน</em></div></div>`}

/* ---------- เปิดร้าน ---------- */
const popHead=t=>`<div class="hrow"><h2 style="margin:0">${t}</h2><button class="btn sm" onclick="closeM()">ปิด</button></div>`;
const tagS=(t,c)=>`<span style="font-size:12px;font-weight:600;padding:2px 8px;border-radius:8px;${c?'background:var(--red-soft);color:var(--red)':'background:var(--green-soft);color:var(--pri)'}">${t}</span>`;
function homeOrders(){const k=TODAY,P=S.pending.filter(p=>(p.date||p.created)==k),O=(S.orders[k]||[]).slice().reverse(),d=dishes(k);
 const row=(o,wait)=>`<div class="it"><span><b>${o.note?esc(o.note):'ออเดอร์ '+o.no}</b> <span class="mut">· ${o.time||''}</span><br><span class="mut">${o.lines.map(l=>esc(l.name)+(l.qty>1?' ×'+l.qty:'')).join(', ')}</span></span><span style="text-align:right;flex-shrink:0"><b>${fm(o.total)}</b><br>${wait?tagS('รอคิดเงิน',1):tagS(o.disc&&o.total<=0?'แถมฟรี':'จ่ายแล้ว')}</span></div>`;
 openM(`${popHead('ออเดอร์วันนี้')}<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0">${[['บิล',O.length+P.length],['จำนวนเสิร์ฟ',(d.done+d.wait)+' จาน']].map(([t,v])=>`<div style="background:var(--soft);border-radius:14px;padding:10px 14px"><small class="mut" style="display:block;font-size:13px">${t}</small><b style="font-size:24px">${v}</b></div>`).join('')}</div>
 ${P.length+O.length?`<div class="list">${P.map(p=>row(p,1)).join('')}${O.map(o=>row(o)).join('')}</div>`:'<p class="mut">ยังไม่มีออเดอร์</p>'}`)}
function homeIncome(){const k=TODAY,s=dayStats(k),y=dayStats(addD(k,-1)),O=(S.orders[k]||[]).slice().reverse(),P=S.pending.filter(p=>(p.date||p.created)==k),tot=s.cash+s.tr,cp=tot?Math.round(s.cash/tot*100):0;
 openM(`${popHead('รายรับวันนี้')}<div class="bignum" style="margin-top:6px"><b style="color:var(--pri)">${fm(tot)} ฿</b><em>${pct(tot,y.sales)} จากเมื่อวาน</em></div>
 <div style="display:flex;height:10px;border-radius:5px;overflow:hidden;margin:12px 0 6px;background:var(--soft)">${tot?`<i style="width:${cp}%;background:#5DCAA5"></i><i style="width:${100-cp}%;background:#85B7EB"></i>`:''}</div>
 <div class="hrow" style="font-size:14px;margin:0"><span>💵 เงินสด ${fm(s.cash)}</span><span>📱 โอน ${fm(s.tr)}</span></div>
 ${O.length?`<div class="list" style="margin-top:10px">${O.map(o=>`<div class="it"><span>${o.payTime||o.time||''} ${o.note?esc(o.note):'ออเดอร์ '+o.no} <span class="mut">· ${o.disc&&o.total<=0?'แถม':o.pay=='cash'?'สด':'โอน'}</span></span><b>${fm(o.total)}</b></div>`).join('')}</div>`:'<p class="mut" style="margin-top:10px">ยังไม่มีรายรับ</p>'}
 ${P.length?`<p class="minus" style="margin-top:8px;font-size:14px">รอคิดเงินอีก ${P.length} บิล · ${fm(P.reduce((a,p)=>a+p.total,0))} บาท (ยังไม่นับ)</p>`:''}`)}
function homeCost(){const k=TODAY,s=dayStats(k),y=dayStats(addD(k,-1)),b=S.buys[k]||[],g=c=>b.filter(x=>catOf(x)==c).reduce((a,x)=>a+x.amount,0);
 const R=[...ING.map(c=>[CATS[c].icon+' '+esc(CATS[c].name),g(c)]),['🔧 อุปกรณ์',g('eq')],['ต้นทุนแฝง (หักรายวัน)',s.hid]];

 openM(`<h2>${pendLabel(p)} · ${free?'แถมฟรี':'รับเงินแบบไหน'}</h2><div class="total">${fm(p.total)} บาท</div>
 ${p.disc?`<p class="mut" style="text-align:center;margin:-6px 0 10px">ราคาเต็ม ${fm(p.full)} · ${discTxt(p)}</p>`:''}

 openM(`<h2>ส่วนลด / แถม</h2><p class="mut">${pendLabel(p)} · ราคาเต็ม ${fm(full)} บาท</p>
 <label>ลดกี่บาท</label><div class="dbtns">${[5,10,20].map(v=>`<button class="btn ${p.disc==v?'pri':''}" onclick="setDisc('${pid}',${v})">-${v}</button>`).join('')}<button class="btn ${p.disc&&p.total<=0?'pri':''}" onclick="setDisc('${pid}',${full})">แถมฟรี</button></div>
 <div class="row" style="margin-top:8px"><input id="dIn" class="f" type="number" inputmode="decimal" placeholder="หรือพิมพ์เอง เช่น 15"><button class="btn pri" onclick="setDisc('${pid}',num($('#dIn').value))">ตกลง</button></div>

 <button class="btn" style="width:100%;margin-top:8px" onclick="payChoose('${pid}')">ย้อนกลับ</button>`)}
function saveDebt(pid){const p=S.pending.find(x=>x.id==pid),name=$('#dbN').value.trim();if(!name)return $('#dbE').textContent='ใส่ชื่อคนค้าง';
 S.debts.push({...p,name,debtFrom:p.debtFrom||p.date});S.pending=S.pending.filter(x=>x.id!=pid);save();closeM();rr();toast('บันทึกค้างจ่าย · '+name+' '+fm(p.total)+' บาท')}
function debtGroups(){const g={};S.debts.forEach(d=>{(g[d.name]=g[d.name]||{name:d.name,L:[],t:0}).L.push(d);g[d.name].t+=d.total});return Object.values(g).sort((a,b)=>b.t-a.t)}
function debtList(){const G=debtGroups();if(!G.length){closeM();return}
 openM(`<div class="hrow"><h2 style="margin:0">ค้างจ่าย</h2><button class="btn sm" onclick="closeM()">ปิด</button></div><p class="mut">${G.length} คน · รวม ${fm(G.reduce((a,x)=>a+x.t,0))} บาท</p>

function debtView(name){const L=S.debts.filter(d=>d.name==name);if(!L.length)return debtList();const t=L.reduce((a,d)=>a+d.total,0);DBN=name;
 openM(`<div class="hrow"><button class="btn sm" onclick="debtList()">‹ กลับ</button><h2 style="margin:0">${esc(name)}</h2></div>
 <div class="list" style="margin-top:8px">${L.map(d=>`<div class="it"><span><span class="mut">${thShort(d.debtFrom)} · ${d.time}</span><br>${d.lines.map(lineText).join('<br>')}</span><b>${fm(d.total)}</b></div>`).join('')}</div>
 <div class="carttotal"><span style="font-size:20px;font-weight:600">ค้างรวม</span><b>${fm(t)} บาท</b></div>
 <button class="btn g wide" onclick="collectDebt()">รับเงินทั้งหมด</button>
 <p class="mut" style="margin-top:8px;font-size:13px">กดแล้วบิลจะไปอยู่ในรอคิดเงินวันนี้ แล้วเลือกเงินสดหรือโอนได้เลย</p>`)}
let DBN='';
function collectDebt(){const L=S.debts.filter(d=>d.name==DBN);if(!L.length)return;const n=new Date(),cnt=S.pending.filter(p=>p.date==TODAY).length+(S.orders[TODAY]||[]).length;
 const p={id:uid(),date:TODAY,created:TODAY,pre:false,no:cnt+1,time:pad(n.getHours())+':'+pad(n.getMinutes()),note:DBN+' (ค้างจ่าย)',lines:L.flatMap(d=>d.lines),total:L.reduce((a,d)=>a+d.total,0),debtFrom:L.map(d=>d.debtFrom).sort()[0]};
 const disc=L.reduce((a,d)=>a+num(d.disc),0);if(disc){p.disc=disc;p.full=p.total+disc}
 S.debts=S.debts.filter(d=>d.name!=DBN);S.pending.push(p);save();rr();payChoose(p.id)}
function setDisc(pid,v){const p=S.pending.find(x=>x.id==pid);if(!p)return;const full=p.full??p.total;v=Math.min(full,Math.max(0,num(v)));
 if(v){p.full=full;p.disc=v;p.total=full-v}else{p.total=full;delete p.full;delete p.disc}save();rr();payChoose(pid)}
function payCash(pid){const t=S.pending.find(x=>x.id==pid).total;
 openM(`<h2>รับเงินสด</h2><div class="total">ยอด ${fm(t)} บาท</div>
 <label>รับเงินมา</label><input id="recv" type="number" inputmode="decimal" oninput="showChange(${t})">
 <div class="row" style="margin-top:8px">${[t,...[20,50,100,500,1000].filter(v=>v>t).slice(0,3)].map(v=>`<button class="btn f" onclick="$('#recv').value=${v};showChange(${t})">${v==t?'พอดี':fm(v)}</button>`).join('')}</div>
 <div class="total" id="chg" style="color:var(--green)"></div>
 <p id="payErr" class="minus" style="text-align:center;min-height:20px;font-size:14px"></p>
 <button class="btn g wide" onclick="cashOK('${pid}',${t})">ยืนยันรับเงิน</button>
 <button class="btn" style="width:100%;margin-top:8px" onclick="payChoose('${pid}')">ย้อนกลับ</button>`)}
function pickQR(t){const Q=S.qrs||[];return Q.find(q=>num(q.amount)>0&&Math.abs(num(q.amount)-t)<0.001)||Q.find(q=>!num(q.amount))||null}
function qrName(q){return q.amount?'คิวอาร์ '+fm(q.amount)+' บาท':'คิวอาร์ทั่วไป'}
function payQR(pid){const p=S.pending.find(x=>x.id==pid),Q=S.qrs||[],q=pickQR(p.total);
 const match=q&&q.amount&&Math.abs(q.amount-p.total)<0.001;
 openM(`<h2>สแกนเพื่อโอน</h2><div class="total">${fm(p.total)} บาท</div>
 ${q?`<img class="qrimg" src="${q.img}" alt="${qrName(q)}"><p style="text-align:center;margin-top:8px;font-weight:600" class="${match?'plus':q.amount?'minus':''}">${qrName(q)}${match?' · ตรงยอด ✓':q.amount?' · ยอดไม่ตรงบิล':' · ให้ลูกค้าพิมพ์ยอด '+fm(p.total)+' บาท'}</p>`
  :`<div class="card" style="text-align:center"><p class="mut">${Q.length?'ไม่มีคิวอาร์ยอด '+fm(p.total)+' บาท และยังไม่มีคิวอาร์ทั่วไป<br>เพิ่มได้ที่หน้าผู้ใช้':'ยังไม่ได้อัปโหลดคิวอาร์โค้ด<br>กดรูปผู้ใช้มุมขวาบนเพื่ออัปโหลด'}</p></div>`}
 ${S.profile.shop?`<p class="mut" style="text-align:center;margin-top:8px">${esc(S.profile.shop)}</p>`:''}
 <button class="btn g wide" style="margin-top:14px" onclick="finishPay('${pid}','tr',0)">ได้รับเงินแล้ว</button>
 <button class="btn" style="width:100%;margin-top:8px" onclick="payChoose('${pid}')">ย้อนกลับ</button>`)}
function cashOK(pid,t){const r=$('#recv').value===''?t:num($('#recv').value);if(r<t){$('#payErr').textContent='รับเงินมายังไม่ครบ ขาดอีก '+fm(t-r)+' บาท';return}finishPay(pid,'cash',r)}

function finishPay(pid,pay,recv){const p=S.pending.find(x=>x.id==pid);if(!p)return;const n=new Date();
 (S.orders[p.date]=S.orders[p.date]||[]).push({id:p.id,no:p.no,note:p.note,pre:p.pre,ptime:p.ptime,done:p.done,time:p.time,payTime:pad(n.getHours())+':'+pad(n.getMinutes()),lines:p.lines,total:p.total,pay,recv,full:p.full,disc:p.disc,debtFrom:p.debtFrom});
 S.pending=S.pending.filter(x=>x.id!=pid);save();closeM();rr()}

function daySummary(k,canDel){const s=dayStats(k),st=num(S.cash[k]),cg=cgNow(k),pr=S.pending.filter(p=>p.date==k&&p.pre);

 ${S.cash[k]!==undefined?`<div class="sum" style="margin-top:8px"><span>เงินทอนเตรียมมา${RO(k)?' (เปิดใหม่ '+RO(k).time+')':''}</span><span>${fm(st)}</span></div>
 <div class="sum"><span>ขายเงินสด${RO(k)?' (หลังเปิดใหม่)':''}</span><span>+${fm(closeExp(k)-st)}</span></div>
 <div class="sum"><b>เงินสดในลิ้นชักควรมี</b><b>${fm(closeExp(k))}</b></div>`:''}
 ${S.close[k]?`<div class="sum"><span>นับได้จริง (ปิดยอด ${S.close[k].time})</span><span>${fm(S.close[k].count)}</span></div><div class="sum t ${S.close[k].count-closeExp(k)<-0.005?'minus':'plus'}"><span>ผลนับเงิน</span><span>${closeTxt(k)}</span></div>`:''}
 ${(()=>{const d=S.debts.filter(x=>x.debtFrom==k);return d.length?`<div class="sum" style="margin-top:8px"><span>📝 ค้างจ่ายจากวันนี้ (ยังไม่นับ)</span><span class="minus">${fm(d.reduce((a,x)=>a+x.total,0))}</span></div>`:''})()}
 ${s.disc?`<div class="sum" style="margin-top:8px"><span>ส่วนลด / แถม (ไม่นับเป็นยอดขาย)</span><span>${fm(s.disc)}</span></div>`:''}
 ${s.waste?`<div class="sum"><span>ของเสีย (ไม่หักซ้ำ)</span><span>${fm(s.waste)}</span></div>`:''}

 <div style="margin-top:14px"></div>
 ${(()=>{const n=pr.length+(S.orders[k]||[]).filter(o=>o.pre).length;return n?`<div class="lrow" onclick="dayPre('${k}',${canDel?1:0})"><span>🚚 ส่งล่วงหน้าวันนี้</span><span><b>${n} ออเดอร์</b><span class="arr">›</span></span></div>`:''})()}
 <div class="lrow" onclick="daySales('${k}',${canDel?1:0})"><span>🧾 รายการขาย</span><span><b>${s.bills} บิล</b><span class="arr">›</span></span></div>`)}

 <div class="list" style="margin-top:6px">${P.map(p=>`<div class="it"><span><b>${p.ptime?p.ptime+' ':''}${pendLabel(p)}</b><br><span class="mut">${pendItems(p)} · ${p.done?'🟢 เสร็จแล้ว':'🟠 กำลังทำ'} · ยังไม่จ่าย</span></span><b>${fm(p.total)}</b></div>`).join('')}

 return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0])}

 return Object.values(R).map(x=>({...x,pf:x.s-x.c})).sort((a,b)=>b.pf-a.pf)}

async function takeCloud(qs){const D2={};qs.docs.forEach(d=>D2[d.id]=JSON.parse(d.data().j));const keepPin=S.pin;S=BLANK();MK.forEach(k=>S[k]={});

function onSnap(qs){if(!syncActive()){setSt('pause');return}let n=0;qs.docChanges().forEach(ch=>{if(ch.type=='removed'||ch.doc.metadata.hasPendingWrites)return;n++;handleRemote(ch.doc.id,ch.doc.data().j)});

async function handleRemote(p,j){if(SY.busy.has(p)){SY.again.add(p);return}let r;try{r=JSON.parse(j)}catch(e){return}const rs=stab(r),sb=SY.sb[p]??'{}';if(rs===SY.sb[p]){if(SY.st!='err')setSt('ok');return}
 if(stab(localPart(p))===sb){if(p=='main')await ensureImgs(r);if(!syncActive())return;if(stab(localPart(p))!==sb){return pushPart(p)}applyPart(p,r);SY.sb[p]=rs;saveSB();saveLocal();SY.last=nowHM();setSt('ok');syncRR()}
 else pushPart(p)}

async function ensureImgs(main){const need=new Set();eachImg(JSON.parse(JSON.stringify(main)),u=>{if(typeof u=='string'&&u.startsWith('@img:')&&!SY.img[u.slice(5)])need.add(u.slice(5));return u});

 for(const h of need){if(SY.img[h])continue;try{const d=await FB.fs.getDoc(FB.fs.doc(FB.db,'shops',SY.user.uid,'imgs',h));if(d.exists())SY.img[h]=d.data().d}catch(e){}}}

async function syncPush(){if(!syncActive()){if(SY.user)setSt('pause');return}const store={},P=splitState(S,store);
 try{await upImgs(store)}catch(e){setSt(navigator.onLine?'err':'offline',e);return retryLater()}
 let any=0;new Set([...Object.keys(P),...Object.keys(SY.sb)]).forEach(p=>{if(stab(P[p]||{})!==(SY.sb[p]??'{}')){any=1;pushPart(p)}});
 if(!any&&SY.st!='err'&&SY.st!='offline')setSt('ok');fixRefs()}
function retryLater(){clearTimeout(syT);syFail=Math.min(syFail+1,6);syT=setTimeout(syncPush,navigator.onLine?Math.min(60000,1500*2**syFail):30000)}
async function pushPart(p){if(SY.busy.has(p)){SY.again.add(p);return}if(!syncActive())return;SY.busy.add(p);setSt('sync');
 const ref=FB.fs.doc(FB.db,'shops',SY.user.uid,'parts',p),loc=localPart(p),locS=stab(loc);let res;
 try{await FB.fs.runTransaction(FB.db,async t=>{const sn=await t.get(ref),cur=sn.exists()?JSON.parse(sn.data().j):undefined,base=SY.sb[p]!=null?JSON.parse(SY.sb[p]):undefined;
   let m=m3(base,loc,cur);if(m===undefined)m={};res=m;const ms=stab(m);if(!cur||stab(cur)!==ms)t.set(ref,{j:ms,ts:Date.now(),dev:DEV})});
  syFail=0;if(syncActive()){const rs=stab(res);if(stab(localPart(p))===locS){if(rs!==locS){if(p=='main')await ensureImgs(res);applyPart(p,res);saveLocal();syncRR()}SY.sb[p]=rs}else{SY.sb[p]=rs;SY.again.add(p)}saveSB()}
  SY.last=nowHM();setSt('ok')}
 catch(e){SY.again.add(p);setSt(navigator.onLine?'err':'offline',e);syFail++}
 finally{SY.busy.delete(p);if(SY.again.has(p)){SY.again.delete(p);if(syFail)retryLater();else setTimeout(syncPush,800)}}}
async function fixRefs(){let need=0;eachImg(JSON.parse(JSON.stringify(S)),u=>{if(typeof u=='string'&&u.startsWith('@img:'))need=1;return u});if(!need||!SY.user)return;

function ck(k){
 if(k=='C'){cx='';cres=''}
 else if(k=='⌫')cx=cx.slice(0,-1);
 else if(k=='='){const r=cev(cx);if(r!==null){cres=cx+' =';cx=String(r)}}
 else{if('÷×−+'.includes(k)&&'÷×−+'.includes(cx.slice(-1)))cx=cx.slice(0,-1);cx+=k}
 $('#cdisp').innerHTML=(cres?`<small>${cres}</small>`:'')+(cx||'0')}
function cev(s){const e=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9+\-*/.]+$/.test(e))return null;
 try{const r=Function('return ('+e+')')();return isFinite(r)?Math.round(r*100)/100:null}catch(x){return null}}
