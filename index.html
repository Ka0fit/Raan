<style>
:root{--bg:#F6F7F5;--card:#fff;--soft:#F1EFEA;--line:#E4E2DC;--line2:#CFCCC4;--text:#222;--mut:#77756f;
--pri:#D85A30;--dark:#4A1B0C;--pri-soft:#FAECE7;--deep:#712B13;--light:#F0997B;
--green:#0F6E56;--green-soft:#E1F5EE;--red:#A32D2D;--red-soft:#FCEBEB;--purple:#534AB7;--purple-soft:#EEEDFE;--blue:#185FA5}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Sarabun",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-size:16px;padding-bottom:96px}
.page{display:none;max-width:600px;margin:0 auto}
.page.on{display:block}
.wrap{padding:0 16px}
/* หัวสีเข้ม */
.band{background:var(--card);color:var(--text);border-bottom:1px solid var(--line);padding:16px 16px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.band.hh{padding-bottom:16px}
.band small{display:block;font-size:13px;color:var(--mut)}
.band h1{font-size:21px;font-weight:600}
.av{width:42px;height:42px;border-radius:50%;background:var(--deep);border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--pri-soft);overflow:hidden;cursor:pointer;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.userbtn{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:26px;padding:3px 14px 3px 3px;cursor:pointer;flex-shrink:0;max-width:50%}
.userbtn span{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{margin:14px 16px 14px;background:var(--card);border-radius:20px;padding:16px;border:1px solid var(--line);position:relative}
.hero small{font-size:13px;color:var(--mut)}
.hero .n{font-size:30px;font-weight:700;margin:2px 0 12px}
.hero .n span{font-size:14px;font-weight:400;color:var(--mut);margin-left:6px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:12px}
.stat div{text-align:center;font-size:12px;color:var(--mut);cursor:pointer}
.stat b{display:block;font-size:16px;color:var(--text)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.duo .bx{cursor:pointer;min-width:0}
.duo .bx small{display:block;font-size:12px;color:var(--mut)}
.duo .bx b{font-size:21px;font-weight:700}
.duo .bx.r{text-align:right;border-left:1px solid var(--line);padding-left:10px}
.duo .bx.r b{color:var(--pri)}
/* การ์ด */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{font-size:16px;font-weight:600;margin-bottom:8px}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px;cursor:pointer;color:var(--text)}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.b{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.r{color:var(--red);border-color:#F09595}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:10px}
.btn.sel{background:var(--pri-soft);color:var(--pri);border-color:var(--pri)}
.wide{width:100%;padding:14px;font-size:18px;font-weight:600;border-radius:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.f{flex:1}
.hrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px;cursor:pointer;min-width:0}
.tile b{display:block;font-size:17px;font-weight:600;margin-bottom:6px;overflow-wrap:anywhere}
.tile.ed{border-style:dashed;border-color:var(--pri)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips span{background:var(--soft);border-radius:6px;padding:2px 7px;font-size:13px;color:var(--mut)}
.choice{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px;margin-bottom:12px;cursor:pointer}
.choice .ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.choice b{display:block;font-size:19px;font-weight:600}
.choice small{font-size:14px;color:var(--mut)}
.secH{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;margin:4px 0 10px}
.plusb{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--card);font-size:18px;line-height:1;color:var(--mut);cursor:pointer}
.sep{border-top:1px solid var(--line);margin:16px 0 12px}
.secT{font-size:15px;font-weight:600;margin:4px 0 10px}
input,select{border:1px solid var(--line2);border-radius:12px;padding:11px 12px;font-size:16px;width:100%;background:var(--card);color:var(--text)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri)}
label{font-size:13px;color:var(--mut);display:block;margin:14px 0 6px}
.chk{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--text)}
.seg{display:grid;gap:5px;background:var(--soft);padding:4px;border-radius:14px}
.seg button{border:0;background:none;border-radius:10px;padding:10px 4px;font-size:15px;color:var(--text);cursor:pointer}
.seg button small{display:block;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--pri);color:#fff}
.seg button.on small{color:var(--pri-soft)}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:5px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:12px}
.tabs button{border:0;background:none;border-radius:10px;padding:10px 4px;font-size:15px;cursor:pointer;color:var(--text)}
.tabs button.on{background:var(--pri-soft);color:var(--deep);font-weight:600}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.list .it:last-child{border-bottom:0}
.sum{display:flex;justify-content:space-between;padding:4px 0}
.sum.t{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.plus{color:var(--green)}.minus{color:var(--red)}
.mut{color:var(--mut);font-size:14px}
.note{color:var(--pri);font-size:14px}
.pend{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);cursor:pointer}
.pend .l{min-width:0}
.pend .l b{font-size:16px;font-weight:600}
.pend .l small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pend .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.pend .r .act{display:flex;gap:6px}
.tag{display:inline-block;background:var(--purple-soft);color:var(--purple);border-radius:8px;font-size:12px;padding:1px 7px;margin-left:4px;vertical-align:2px}
/* สรุป */
.bigc{background:var(--green-soft);border-radius:18px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.bigc.neg{background:var(--red-soft)}
.bigc small{display:block;font-size:13px;color:var(--mut)}
.bigc b{font-size:30px;font-weight:700;color:var(--green)}
.bigc.neg b{color:var(--red)}
.bigc em{font-style:normal;font-size:13px;color:var(--mut);margin-left:8px}
.smc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer}
.smc small{display:block;font-size:12px;color:var(--mut)}
.smc b{font-size:20px;font-weight:700}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:8px;font-size:15px;color:var(--mut);cursor:pointer}
.lrow b{color:var(--text);font-weight:600;text-align:right}
.lrow.warn{background:var(--red-soft);border-color:#F09595}
.lrow.warn b{color:var(--red)}
.lrow.ok b{color:var(--green)}
.lrow .arr{color:var(--mut);margin-left:4px}
.mnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mnav b{font-size:18px}
.mnav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:var(--card);font-size:16px;color:var(--text)}
/* ปฏิทิน */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{height:46px;border-radius:12px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.cal .h{height:auto;font-size:12px;color:var(--mut);padding-bottom:4px;cursor:default}
.cal .e{cursor:default}
.cal .o{background:var(--pri-soft);color:var(--deep);font-weight:600}
.cal .td{background:var(--pri);color:#fff;font-weight:700}
.dots{display:flex;gap:3px;margin-top:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.dp{background:#7F77DD}.db{background:#1D9E75}.dw{background:#fff}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:12px}
.lg span{display:flex;align-items:center;gap:5px}
.lg .sw{width:12px;height:12px;border-radius:4px;background:var(--pri-soft)}
.preC{display:flex;align-items:center;gap:12px;cursor:pointer}
.preC .ic{width:46px;height:46px;border-radius:14px;background:var(--purple-soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.preC b{display:block;font-size:16px;font-weight:600}
.preC small{font-size:13px;color:var(--mut)}
.badge{background:var(--purple);color:#fff;border-radius:10px;font-size:12px;padding:1px 8px;margin-left:4px;vertical-align:2px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:30}
.overlay.on{display:flex}
.box{background:var(--card);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.box h2{font-size:21px;font-weight:600;margin-bottom:4px}
.total{font-size:26px;font-weight:700;text-align:center;margin:12px 0;color:var(--pri)}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.amt{font-size:24px;font-weight:700;color:var(--pri)}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--card);font-size:20px;color:var(--text)}
.qty b{min-width:22px;text-align:center;font-size:18px}
.citem{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.citem .top{display:flex;justify-content:space-between;gap:8px}
.citem .name{font-size:18px;font-weight:600}

<script>
if(window.__RUN_STORED)throw 'running updated version';
const $=s=>document.querySelector(s);
const KEY='shopapp_v1';
const BLANK=()=>({fixed:[],lastBackup:'',menus:[],items:[],orders:{},buys:{},cash:{},boxFee:5,pending:[],profile:{shop:'',owner:''},qr:'',qrs:[],avatar:'',theme:'forest',pin:'',cats:['อาหารจานเดียว','ก๋วยเตี๋ยว','กับข้าว','ของทานเล่น','เครื่องดื่ม']});
const META_K='shopapp_meta';

try{const m=JSON.parse(localStorage.getItem(META_K));if(m&&m.users&&m.users.length)META=Object.assign(META,m)}catch(e){}
function saveMeta(){try{localStorage.setItem(META_K,JSON.stringify(META))}catch(e){}}

function loadUser(id){META.cur=id;S=readData(id);AV=readAv(id);
 if(S.avatar){AV=S.avatar;try{localStorage.setItem(avKey(id),AV)}catch(e){}delete S.avatar;save()}
 fix();cart=[];cartNote='';saveMeta()}

 const u=META.users.find(x=>x.id==META.cur);if(u&&u.name!=S.profile.owner){u.name=S.profile.owner;saveMeta()}}

function hidOn(k){let t=0;(S.fixed||[]).forEach(f=>{if(k<f.start||(f.end&&k>=f.end))return;const[y,m]=k.split('-').map(Number);
 t+=f.period=='month'?f.amount/new Date(y,m,0).getDate():f.period=='week'?f.amount/7:f.amount});return t}
function dayStats(k){const o=S.orders[k]||[],b=S.buys[k]||[];let cash=0,tr=0,ing=0,eq=0;
 o.forEach(x=>x.pay=='cash'?cash+=x.total:tr+=x.total);b.forEach(x=>x.type=='ing'?ing+=x.amount:eq+=x.amount);
 const hid=k<=TODAY?hidOn(k):0;
 return{cash,tr,sales:cash+tr,ing,eq,hid,cost:ing+eq+hid,profit:cash+tr-ing-eq-hid,bills:o.length}}
function daysOf(pre){let out=[];if(pre.length==10)out=[pre];
 else if(pre.length==7){const[y,m]=pre.split('-').map(Number),n=new Date(y,m,0).getDate();for(let d=1;d<=n;d++)out.push(pre+'-'+pad(d))}
 else for(let m=1;m<=12;m++)out=out.concat(daysOf(pre+'-'+pad(m)));
 return out.filter(k=>k<=TODAY)}
function rangeStats(pre){const t={cash:0,tr:0,sales:0,ing:0,eq:0,hid:0,cost:0,profit:0,bills:0};
 daysOf(pre).forEach(k=>{const s=dayStats(k);for(const i in t)t[i]+=s[i]});return t}
function menuCount(pre){const m={};Object.keys(S.orders).forEach(k=>{if(!k.startsWith(pre))return;S.orders[k].forEach(o=>o.lines.forEach(l=>{const n=l.name+' ('+SIZES[l.size]+')';m[n]=(m[n]||0)+l.qty}))});
 return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function changeGiven(k){return (S.orders[k]||[]).reduce((a,o)=>a+(o.pay=='cash'&&o.recv>o.total?o.recv-o.total:0),0)}

function sumShift(n){if(sumMode=='day'){const[y,m,d]=D.sum.split('-').map(Number);D.sum=key(new Date(y,m-1,d+n))}
 else if(sumMode=='month'){sumM+=n;if(sumM<0){sumM=11;sumY--}if(sumM>11){sumM=0;sumY++}}else sumY+=n;rr()}
function sumWord(){return sumMode=='day'?'วันนี้':sumMode=='month'?'เดือนนี้':'ปีนี้'}
function buysIn(pre,type){const out=[];Object.keys(S.buys).forEach(k=>{if(k.startsWith(pre))S.buys[k].forEach(b=>{if(b.type==type)out.push({...b,k})})});return out}

 openM(`<div class="hrow"><h2 style="margin:0">รอคิดเงิน (${P.length})</h2><button class="btn sm" onclick="closeM()">ปิด</button></div>${P.map(p=>pendRow(p,true)).join('')}`)}

 if(t=='hid'){const ds=daysOf(pre),E=(S.fixed||[]).map(f=>[f,ds.reduce((a,k)=>a+((k<f.start||(f.end&&k>=f.end))?0:perDay(f,k)),0)]).filter(x=>x[1]>0);

 if(t=='ing'||t=='eq'){const L=buysIn(pre,t),g={};L.forEach(b=>{g[b.name]=(g[b.name]||0)+b.amount});const E=Object.entries(g).sort((a,b)=>b[1]-a[1]);
  h=`<h2>${t=='ing'?'วัตถุดิบ':'อุปกรณ์'}</h2><p class="mut">${sumLabel()}</p>${E.length?`<div class="list" style="margin-top:8px">${E.map(([n,a])=>`<div class="it"><span>${esc(n)}</span><b>${fm(a)}</b></div>`).join('')}</div><div class="sum t"><span>รวม</span><span>${fm(t=='ing'?s.ing:s.eq)}</span></div>`:'<p class="mut" style="margin-top:8px">ยังไม่มี</p>'}`}
 if(t=='top'){const c=menuCount(pre);h=`<h2>เมนูขายดี</h2><p class="mut">${sumLabel()}</p>${c.length?`<div class="list" style="margin-top:8px">${c.map(([n,q],i)=>`<div class="it"><span>${i+1}. ${esc(n)}</span><b>${q} จาน</b></div>`).join('')}</div>`:'<p class="mut" style="margin-top:8px">ยังไม่มี</p>'}`}
 if(t=='months')h=`<h2>แยกรายเดือน</h2><p class="mut">${sumLabel()}</p><div class="list" style="margin-top:8px">${MTHF.map((m,i)=>{const x=rangeStats(sumY+'-'+pad(i+1));return `<div class="it" style="cursor:pointer" onclick="sumMode='month';sumM=${i};closeM();rr()"><span>${m}<br><span class="mut">ขาย ${fm(x.sales)} · ทุน ${fm(x.cost)}</span></span><b class="${x.profit>=0?'plus':'minus'}">${x.profit>=0?'+':'-'}${fm(Math.abs(x.profit))}</b></div>`}).join('')}</div>`;
 openM(h+`<button class="btn wide" style="margin-top:14px" onclick="closeM()">ปิด</button>`)}

function addUser(){if(DEMO)return toast('ล้างตัวอย่างก่อน');const name=$('#nuName').value.trim(),pin=$('#nuPin').value.trim();if(!name)return toast('ใส่ชื่อ');if(pin&&!/^\d{4}$/.test(pin))return toast('รหัสต้องเป็นตัวเลข 4 ตัว');
 const id='u'+Date.now().toString(36),d=BLANK();d.profile={shop:$('#nuShop').value.trim(),owner:name};d.pin=pin;d.theme=S.theme;
 try{localStorage.setItem(dataKey(id),JSON.stringify(d))}catch(e){return toast('บันทึกไม่สำเร็จ')}
 META.users.push({id,name});saveMeta();closeM();loadUser(id);applyTheme();go('sell')}
function switchUser(id){if(DEMO)return toast('ล้างตัวอย่างก่อน');const d=readData(id);
 if(d.pin&&d.pin.length==4){lockTarget=id;pinBuf='';showLock()}else{loadUser(id);applyTheme();go('sell')}}
function uploadImg(inp,field){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const img=new Image();img.onload=()=>{const max=field=='avatar'?240:field=='menu'?360:700,sc=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  const url=c.toDataURL('image/jpeg',field=='menu'?0.72:0.88);
  if(field=='menu'){menuImg=url;const pv=$('#mpv');if(pv)pv.innerHTML=`<img src="${url}" alt="">`;const dl=$('#mdel');if(dl)dl.hidden=false;return}
  if(field=='avatar'){AV=url;try{localStorage.setItem(avKey(META.cur),url)}catch(e){toast('บันทึกรูปไม่สำเร็จ')}rr()}else if(field=='qr'&&qrTmp){qrTmp.amount=num(($('#qrAmt')||{}).value);qrTmp.img=url;qrDraw()}};img.src=r.result};r.readAsDataURL(f);inp.value=''}

/* ---------- สำรองข้อมูลแบบโค้ด ---------- */
const b64e=t=>btoa(unescape(encodeURIComponent(t))), b64d=t=>decodeURIComponent(escape(atob(t)));
function makeCode(){if(!DEMO){S.lastBackup=TODAY;save()}return 'SHOP1:'+b64e(JSON.stringify(S))}
function backupView(){const c=makeCode();openM(`<h2>โค้ดสำรอง</h2><p class="mut">คัดลอกแล้วไปวางเก็บใน LINE Keep หรือโน้ต · ยาว ${fm(c.length)} ตัวอักษร</p>
 <textarea id="bkCode" readonly style="margin-top:10px">${c}</textarea>
 <button class="btn pri wide" style="margin-top:10px" onclick="copyCode()">คัดลอกโค้ด</button><button class="btn" style="width:100%;margin-top:8px" onclick="closeM();rr()">ปิด</button>`)}
function copyCode(){const t=$('#bkCode');const ok=()=>toast('คัดลอกแล้ว');
 if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(ok,()=>{t.select();document.execCommand('copy');ok()});else{t.select();document.execCommand('copy');ok()}}
function restoreView(){openM(`<h2>กู้คืนจากโค้ด</h2><p class="mut">ข้อมูลของ ${esc(S.profile.owner||'ผู้ใช้นี้')} ในเครื่องจะถูกแทนที่ด้วยข้อมูลในโค้ด</p>
 <textarea id="rsCode" placeholder="วางโค้ดที่นี่" style="margin-top:10px"></textarea>
 <button class="btn pri wide" style="margin-top:10px" onclick="restoreCode($('#rsCode').value,false)">กู้คืน</button><button class="btn" style="width:100%;margin-top:8px" onclick="closeM()">ยกเลิก</button>`)}
function restoreCode(code,fromLock,ok){let d;try{code=code.trim().replace(/\s+/g,'');if(!code.startsWith('SHOP1:'))throw 0;d=JSON.parse(b64d(code.slice(6)));if(!d.menus)throw 0}catch(e){return toast('โค้ดไม่ถูกต้อง ลองคัดลอกใหม่ให้ครบ')}
 if(!fromLock&&!ok)return ask('แทนที่ข้อมูลทั้งหมดด้วยโค้ดนี้?',()=>restoreCode(code,fromLock,1));
 if(fromLock&&lockTarget){META.cur=lockTarget;lockTarget=null}
 if(DEMO){DEMO=false;REAL=null}
 S=Object.assign(BLANK(),d);delete S.avatar;fix();save();AV=readAv(META.cur);saveMeta();applyTheme();closeM();
 pinBuf='';$('#lock').classList.remove('on');toast('กู้คืนแล้ว');go(fromLock?'sell':'user')}

/* ---------- ข้อมูลตัวอย่าง ---------- */
function dayKey(off){return key(new Date(Date.now()+off*864e5))}
function makeDemo(){const d=BLANK();d.profile={shop:'ร้านกะเพราเจ๊หมวย (ตัวอย่าง)',owner:S.profile.owner||'หมิง'};d.theme=S.theme;d.boxFee=5;d.qrs=S.qrs||[];
 const M=[['กะเพราหมู',[50,60,80]],['ข้าวผัดหมู',[45,55,70]],['ผัดซีอิ๊ว',[50,60,75]],['ไข่เจียวหมูสับ',[40,50,60]],['ราดหน้า',[50,60,80]]];
 d.menus=M.map(([name,p],i)=>({id:uid(),name,p,cat:i==2?'ก๋วยเตี๋ยว':'อาหารจานเดียว'}));d.menus.push({id:uid(),name:'น้ำเปล่า',p:[10,0,0],cat:'เครื่องดื่ม'},{id:uid(),name:'ไก่ทอด',p:[40,0,0],cat:'ของทานเล่น'});
 const I=[['หมูสับ',140,'กิโล','ing','meat'],['หมูสามชั้น',180,'กิโล','ing','meat'],['ไข่ไก่',120,'แพ็ค','ing','veg'],['ผักบุ้ง',10,'กำ','ing','veg'],['กะหล่ำ',25,'หัว','ing','veg'],['กล่องโฟม',90,'แพ็ค','eq'],['ช้อนพลาสติก',35,'แพ็ค','eq']];
 d.items=I.map(([name,price,unit,type,cat])=>type=='eq'?{id:uid(),name,price,unit,type}:{id:uid(),name,price,unit,type,cat});
 const start=new Date();start.setDate(1);const days=new Date().getDate();
 d.fixed=[{id:uid(),name:'ค่าห้อง',amount:3000,period:'month',start:key(start),end:null},{id:uid(),name:'ค่าไฟ',amount:150,period:'week',start:key(start),end:null}];
 const notes=['','','โต๊ะ 1','โต๊ะ 2','','พี่แดง','','โต๊ะ 4',''];
 for(let i=days-1;i>=0;i--){const k=dayKey(-i),dw=new Date(Date.now()-i*864e5).getDay();if(dw==0)continue;
  d.cash[k]=2000;const n=i==0?6:12+Math.floor(Math.random()*10);d.orders[k]=[];
  for(let j=0;j<n;j++){const m=d.menus[Math.floor(Math.random()*5)],size=Math.random()<.5?0:Math.random()<.7?1:2,take=Math.random()<.4,qty=Math.random()<.75?1:2,u=m.p[size]+(take?5:0);
   const h=10+Math.floor(j*6/n),mi=Math.floor(Math.random()*60),tot=u*qty,cash=Math.random()<.6,recv=cash?(tot<=100?100:tot<=500?500:1000):0;
   d.orders[k].push({id:uid(),no:j+1,note:notes[j%9],time:pad(h)+':'+pad(mi),payTime:pad(h)+':'+pad(Math.min(59,mi+15)),lines:[{mid:m.id,name:m.name,size,extra:0,qty,take,note:'',unit:u,total:tot}],total:tot,pay:cash?'cash':'tr',recv:Math.random()<.5?tot:recv})}
  if(i%3==0)d.buys[k]=[{id:uid(),name:'หมูสับ',type:'ing',cat:'meat',qty:3,qtyText:'3 โล',amount:420},{id:uid(),name:'ไข่ไก่',type:'ing',cat:'veg',qty:2,qtyText:'2 แพ็ค',amount:240},{id:uid(),name:'ผักบุ้ง',type:'ing',cat:'veg',qty:10,qtyText:'10 กำ',amount:100}].concat(i%6==0?[{id:uid(),name:'กล่องโฟม',type:'eq',qty:1,qtyText:'1 แพ็ค',amount:90}]:[])}
 const L=(m,qty,take)=>{const u=m.p[0]+(take?5:0);return{mid:m.id,name:m.name,size:0,extra:0,qty,take,note:'',unit:u,total:u*qty}};
 const P=(date,pre,note,lines,no)=>({id:uid(),date,created:TODAY,pre,no,time:pad(11+Math.floor(no*7/60))+':'+pad((no*7)%60),note,lines,total:lines.reduce((a,l)=>a+l.total,0)});
 d.pending=[P(TODAY,false,'โต๊ะ 3',[L(d.menus[0],1,false),L(d.menus[1],2,false)],7),P(TODAY,false,'',[L(d.menus[2],1,true)],8),
  Object.assign(P(TODAY,true,'ป้าแดง',[L(d.menus[1],4,true)],9),{ptime:'16:30',done:false}),Object.assign(P(dayKey(1),true,'พี่แดง 081-xxx',[L(d.menus[0],10,true)],1),{ptime:'11:00',done:true}),Object.assign(P(dayKey(4),true,'งานบุญวัด',[L(d.menus[1],20,true),L(d.menus[3],10,true)],1),{ptime:'09:00',done:false}),Object.assign(P(dayKey(7),true,'ป้าศรี',[L(d.menus[4],5,true)],1),{ptime:'',done:false})];
 return d}
function enterDemo(){REAL=S;S=makeDemo();DEMO=true;cart=[];closeM();go('sell');toast('เปิดข้อมูลตัวอย่างแล้ว')}
function exitDemo(){if(!DEMO)return;S=REAL;REAL=null;DEMO=false;cart=[];closeM();applyTheme();go('user');toast('กลับมาข้อมูลจริงแล้ว')}

/* ---------- เครื่องคิดเลข ---------- */
let cx='',cres='';
const KEYS=['C','⌫','÷','×','7','8','9','−','4','5','6','+','1','2','3','.','0','00','='];
$('#ckeys').innerHTML=KEYS.map(k=>`<button class="${'÷×−+⌫C'.includes(k)?'op':''} ${k=='='?'eq':''}" onclick="ck('${k}')">${k}</button>`).join('');
function ck(k){
 if(k=='C'){cx='';cres=''}
 else if(k=='⌫')cx=cx.slice(0,-1);
 else if(k=='='){const r=cev(cx);if(r!==null){cres=cx+' =';cx=String(r)}}
 else{if('÷×−+'.includes(k)&&'÷×−+'.includes(cx.slice(-1)))cx=cx.slice(0,-1);cx+=k}
 $('#cdisp').innerHTML=(cres?`<small>${cres}</small>`:'')+(cx||'0')}
function cev(s){const e=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9+\-*/.]+$/.test(e))return null;
 try{const r=Function('return ('+e+')')();return isFinite(r)?Math.round(r*100)/100:null}catch(x){return null}}

loadUser(META.cur);applyFont();applyTheme();
go('sell');
if(needLock())showLock();
